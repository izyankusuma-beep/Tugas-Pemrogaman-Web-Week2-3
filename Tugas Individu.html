<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman Simpel Estetik</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Bungee&display=swap');

    body {
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #74ebd5 0%, #acb6e5 100%);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .container {
        background-color: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 15px 25px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 400px;
        width: 85%;
        position: relative;
        z-index: 1;
    }

    h1 {
        color: #333;
        margin-top: 0;
        font-weight: 600;
    }

    p {
        color: #666;
        line-height: 1.6;
        margin-bottom: 30px;
        font-size: 15px;
    }

    /* Tombol ala Bumblebee: hitam-kuning */
    #laserBtn {
        font-family: 'Bungee', 'Poppins', sans-serif;
        background: repeating-linear-gradient(
            45deg,
            #111 0px, #111 14px,
            #ffcc00 14px, #ffcc00 28px
        );
        color: #ffcc00;
        border: 3px solid #ffcc00;
        padding: 14px 28px;
        font-size: 16px;
        border-radius: 10px;
        cursor: pointer;
        letter-spacing: 1px;
        text-shadow: 2px 2px 0 #000, -1px -1px 0 #000;
        box-shadow: 0 0 12px rgba(255, 204, 0, 0.6);
        transition: all 0.2s ease;
    }

    #laserBtn:hover {
        transform: translateY(-3px) scale(1.03);
        box-shadow: 0 0 20px rgba(255, 204, 0, 0.9);
    }

    #laserBtn:active {
        transform: translateY(0) scale(0.97);
    }

    /* Lapisan tempat animasi laser ditembakkan */
    #laserLayer {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 500;
        display: none;
    }

    #laserLayer.active {
        display: block;
    }

    .laser {
        position: absolute;
        width: 160vmax;
        height: 4px;
        background: linear-gradient(90deg, transparent, #fff9c4, #ffe600, #fff9c4, transparent);
        box-shadow:
            0 0 8px 2px #ffe600,
            0 0 16px 4px #ff4500;
        opacity: 0;
    }
</style>
</head>
<body>

    <div class="container">
        <h1>Halo Semuanya! 👋</h1>
        <p>Ini adalah Tugas Halaman web simpel menggunakan CSS dan HTML dan ini adalah tugas saya. Silahkan klik di bawah ini untuk lihat animasi.</p>
        <button id="laserBtn" onclick="startLaserShow()">⚡ KLIK SAYA ⚡</button>
    </div>

    <div id="laserLayer"></div>

    <script>
        let laserInterval = null;
        let laserTimeout = null;

        function spawnLaser(fromLeft) {
            const layer = document.getElementById('laserLayer');
            const beam = document.createElement('div');
            beam.className = 'laser';

            const originY = 10 + Math.random() * 80; // posisi vertikal awal (%)
            const goUp = Math.random() > 0.5;
            let angle = 15 + Math.random() * 55; // sudut tembak 15-70 derajat
            if (goUp) angle = -angle;
            if (!fromLeft) angle = -angle; // dibalik biar dari kanan arahnya ke kiri

            beam.style.top = originY + '%';
            beam.style[fromLeft ? 'left' : 'right'] = '0';
            beam.style.transformOrigin = fromLeft ? 'left center' : 'right center';
            beam.style.transform = `rotate(${angle}deg) scaleX(0)`;
            beam.style.opacity = '1';

            layer.appendChild(beam);

            requestAnimationFrame(() => {
                beam.style.transition = 'transform 0.35s ease-out, opacity 0.5s ease-in 0.25s';
                beam.style.transform = `rotate(${angle}deg) scaleX(1)`;
                beam.style.opacity = '0';
            });

            setTimeout(() => beam.remove(), 700);
        }

        function startLaserShow() {
            const layer = document.getElementById('laserLayer');
            layer.classList.add('active');

            if (laserInterval) clearInterval(laserInterval);
            if (laserTimeout) clearTimeout(laserTimeout);

            laserInterval = setInterval(() => {
                spawnLaser(true);
                spawnLaser(false);
            }, 130);

            laserTimeout = setTimeout(() => {
                clearInterval(laserInterval);
                setTimeout(() => layer.classList.remove('active'), 800);
            }, 10000); // berhenti setelah 10 detik
        }
    </script>

</body>
</html>
