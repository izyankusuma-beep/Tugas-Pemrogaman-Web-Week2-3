<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Simpel Estetik</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #74ebd5 0%, #acb6e5 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 85%;
        }

        h1 {
            color: #333;
            margin-top: 0;
            font-weight: 600;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 15px;
        }

        button {
            background-color: #5b86e5;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #36d1dc;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(54, 209, 220, 0.4);
        }

        /* Overlay gelap di belakang kotak data diri */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .overlay.active {
            display: flex;
        }

        /* Kotak kecil berisi data diri */
        .profile-card {
            background-color: white;
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
            text-align: center;
            width: 260px;
            animation: popIn 0.25s ease;
        }

        @keyframes popIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .profile-card img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #5b86e5;
            margin-bottom: 15px;
        }

        .profile-card .data-row {
            text-align: left;
            font-size: 14px;
            color: #333;
            margin: 6px 0;
        }

        .profile-card .data-row span {
            font-weight: 600;
            color: #5b86e5;
        }

        .close-btn {
            margin-top: 18px;
            background-color: #eee;
            color: #333;
            padding: 8px 22px;
            font-size: 14px;
        }

        .close-btn:hover {
            background-color: #ddd;
            color: #333;
            box-shadow: none;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Halo Semuanya! 👋</h1>
        <p>Ini adalah contoh halaman web simpel yang dibuat menggunakan HTML dan CSS murni. Desainnya terlihat bersih, modern, dan tentu saja bagus!</p>
        <button onclick="document.getElementById('profileOverlay').classList.add('active')">Klik Saya</button>
    </div>
